name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build
      # `build` also packages the Chrome extension (scripts/build-extension.ts);
      # keep the zip so every commit has an installable build to download.
      - uses: actions/upload-artifact@v7
        with:
          name: tech-radar-extension-${{ github.sha }}
          path: dist/extension/tech-radar-extension.zip
          if-no-files-found: error
