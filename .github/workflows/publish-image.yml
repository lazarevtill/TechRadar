name: Publish image

# The app is SSR on Bun, so it needs a runtime — there is no static-hosting
# shortcut. This publishes a ready-to-run image to GHCR using the built-in
# token, so deploying needs no third-party account or secret.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**' # the daily data commit must not trigger a rebuild
      - 'docs/**'
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
