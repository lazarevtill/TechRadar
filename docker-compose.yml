services:
  techradar:
    build:
      context: .
      args:
        # Default server address of the "Download Extension" build (changeable
        # in the extension's Settings); set for a deployed host.
        EXTENSION_BACKEND_URL: ${EXTENSION_BACKEND_URL:-http://localhost:3000}
    image: ghcr.io/lazarevtill/techradar:latest
    # So LLM_BASE_URL=http://host.docker.internal:11434 reaches a model server
    # on the host. Docker Desktop and OrbStack provide this name themselves;
    # Docker Engine on Linux does not, and this adds it.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      # Host port is configurable (bun run setup --port, or PORT in .env);
      # inside the container the server always listens on 3000.
      - '${PORT:-3000}:3000'
    environment:
      # Live data comes from public APIs and the digest from public raw URLs.
      # Fixed on purpose: the published port above is what you change.
      PORT: 3000
      # Jev (TypeSafe) assigns feed categories. Without it every live item is
      # shown as "Unclassified". Read from the host env / .env, never inlined.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # Point the judgments at your own endpoint instead of the hosted service:
      # any host that speaks the TypeSafe API, reachable by IP, hostname or
      # http(s) URL. Unset = hosted. Leaving TYPESAFE_API_KEY empty disables
      # judgments entirely (items show as Unclassified, ranking by engagement).
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-}
      # Or judge on your own hardware with no key: any OpenAI-compatible
      # server. From a container, localhost is the container — use
      # host.docker.internal (Docker Desktop/OrbStack) or the host's LAN IP.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-}
      JUDGE_BACKEND: ${JUDGE_BACKEND:-}
      # Per-source time budget (ms); empty = the built-in default.
      SOURCE_BUDGET_MS: ${SOURCE_BUDGET_MS:-}
      # Tracked topics, read from the mounted ./config below. A path outside
      # that directory would have to be mounted too.
      TOPICS_FILE: ${TOPICS_FILE:-config/topics.json}
      # Optional contact emails: raise the MyMemory translation quota and use
      # OpenAlex's polite pool. Read from the host env / .env.
      MYMEMORY_EMAIL: ${MYMEMORY_EMAIL:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      # Characters the dashboard's "translate" button may send per day.
      TRANSLATE_ON_DEMAND_DAILY_CHARS: ${TRANSLATE_ON_DEMAND_DAILY_CHARS:-}
      # Optional, server-side only: more GitHub searches per refresh.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Optional webhooks ({"text": ...}): weekly report and source alerts.
      REPORT_WEBHOOK_URL: ${REPORT_WEBHOOK_URL:-}
      REPORT_WATCH: ${REPORT_WATCH:-}
      WATCH_WEBHOOK_URL: ${WATCH_WEBHOOK_URL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Protects operator actions and data; set it on an internet-facing host.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # The schedule and the history store; empty = the built-in defaults.
      FEED_SCHEDULE_MINUTES: ${FEED_SCHEDULE_MINUTES:-}
      HISTORY_RETAIN_DAYS: ${HISTORY_RETAIN_DAYS:-}
      # Optional: keep backups off the data volume (see README, Backups) —
      # BACKUP_DIR=/backups together with the ./backups mount below.
      BACKUP_DIR: ${BACKUP_DIR:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Another fork's generated digest data; empty = this repository's.
      DIGEST_DATA_BASE_URL: ${DIGEST_DATA_BASE_URL:-}
      # Not passed, on purpose: HISTORY_DB and JEV_CACHE_FILE (fixed to the
      # volume below) and server.ts static-asset tuning (ASSET_PRELOAD_*,
      # IMAGINE_PREVIEW), whose defaults fit this image.
    volumes:
      # Your own tracked topics, read at runtime (config/topics.json). Mounted
      # as a directory because a bind mount of a file that does not exist yet
      # makes Docker create a directory in its place.
      - ./config:/app/config:ro
      # Jev verdicts and the history store (with its daily backups): survive
      # rebuilds, so unchanged items are never re-sent and history accumulates.
      - techradar-cache:/app/.cache
      # - ./backups:/backups   # with BACKUP_DIR=/backups
    # One replica only: the history is a single SQLite file.
    restart: unless-stopped

volumes:
  techradar-cache:
